<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0910" />
  <title>Aether & Steel: Dark Fantasy Match-3 Tactical RPG</title>
  <link rel="icon" type="image/png" href="./icons/ui/gold_coin.webp">
  
  <!-- Local Fonts from Aether & Steel: Dark Fantasy Idle -->
  <link rel="preload" href="./fonts/RosencrantzNbp.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./fonts/GuildensternNbp.ttf" as="font" type="font/ttf" crossorigin>
  
  <!-- Google Fonts: Medieval & Fantasy Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Rosencrantz NBP';
      src: local('Rosencrantz NBP'), url('./fonts/RosencrantzNbp.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Guildenstern NBP';
      src: local('Guildenstern NBP'), url('./fonts/GuildensternNbp.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08070d;
      font-family: 'Rosencrantz NBP', 'Rosencrantz', monospace, sans-serif;
      color: #f4f4f5;
      display: flex;
      justify-content: center;
      align-items: center;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #desktop-ambient-bg {
      position: fixed;
      inset: -40px;
      background: radial-gradient(circle at 50% 35%, rgba(20, 16, 36, 0.42) 0%, rgba(8, 7, 13, 0.94) 80%),
                  url('./biomes/biome_1.webp') center / cover no-repeat;
      filter: blur(34px) brightness(0.38) saturate(1.25);
      transform: scale(1.08);
      z-index: 0;
      pointer-events: none;
      transition: background-image 1.2s ease, opacity 0.8s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Guildenstern NBP', 'Guildenstern', monospace, sans-serif;
      letter-spacing: 0.03em;
    }

    #app-container {
      width: 100%;
      max-width: 460px;
      height: 100%;
      max-height: 920px;
      position: relative;
      background: #0a0910;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.98), 0 0 32px rgba(234, 179, 8, 0.16), inset 0 0 0 1px rgba(234, 179, 8, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Modal / Dialog Overlay */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 9, 16, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: #12111d;
      border: 2px solid #eab308;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 15px rgba(234, 179, 8, 0.15);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-family: 'Guildenstern NBP', 'Guildenstern', monospace;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid transparent;
      box-shadow: inset -2px -2px 0px 0px #000, inset 2px 2px 0px 0px rgba(255,255,255,0.15);
      transition: all 0.1s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-gold {
      background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
      color: #0a0910;
      border-color: #fef08a;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.4), inset -2px -2px 0px 0px #000;
    }
    .btn-gold:hover {
      background: linear-gradient(180deg, #fde047 0%, #eab308 100%);
    }
    .btn-crimson {
      background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
      color: #fff;
      border-color: #fca5a5;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4), inset -2px -2px 0px 0px #000;
    }
    .btn-crimson:hover {
      background: linear-gradient(180deg, #f87171 0%, #b91c1c 100%);
    }
    .btn-dark {
      background: #1a1829;
      color: #a1a1aa;
      border-color: #3b3459;
    }
    .btn-dark:hover {
      color: #fff;
      border-color: #eab308;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DgRBC2e9.js"></script>
</head>
<body>
  <div id="desktop-ambient-bg"></div>
  <div id="app-container">
    <!-- Main game view injected here -->
  </div>
</body>
</html>
